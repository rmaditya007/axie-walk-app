<title>Petal Trail</title>
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #131316;
    --surface-2: #1c1c20;
    --border: #26262c;
    --text: #f5f5f7;
    --text-dim: #8b8b93;
    --text-faint: #59595f;
    --amber: #ff9d2e;
    --amber-ink: #241300;
    --mint: #6be3a6;
    --danger: #ff6b57;
    --shadow: rgba(0, 0, 0, 0.55);
  }

  /* This app deliberately commits to one dark look — it mirrors the
     always-dark Axie Marketplace UI it's modeled on — so colors are
     painted explicitly here rather than split across light/dark blocks. */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  #app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
  }

  /* ---------------- stat strip ---------------- */
  .stat-strip {
    display: flex;
    padding: 16px 18px 10px;
    gap: 8px;
    flex: none;
  }

  .stat {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-value {
    font-family: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .stat-primary .stat-value { color: var(--amber); font-size: 24px; }

  .stat-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
  }

  /* ---------------- mode row ---------------- */
  .mode-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px 10px;
    flex: none;
    gap: 10px;
  }

  .mode-toggle {
    display: flex;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px;
  }

  .mode-btn {
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 18px;
    border-radius: 999px;
    cursor: pointer;
  }

  .mode-btn[data-selected="true"] {
    background: var(--amber);
    color: var(--amber-ink);
  }

  .gps-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .gps-tag .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-faint);
  }

  .gps-tag[data-state="live"] .dot { background: var(--mint); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mint) 25%, transparent); }
  .gps-tag[data-state="simulated"] .dot { background: var(--amber); box-shadow: 0 0 0 3px color-mix(in srgb, var(--amber) 25%, transparent); }
  .gps-tag[data-state="live"] { color: var(--mint); }
  .gps-tag[data-state="simulated"] { color: var(--amber); }

  /* ---------------- trail canvas ---------------- */
  .trail-wrap {
    position: relative;
    flex: 1 1 auto;
    margin: 0 10px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface);
    min-height: 0;
  }

  #trail-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .trail-tag {
    position: absolute;
    left: 12px;
    top: 12px;
    z-index: 5;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  .map-banner {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 5;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    padding: 9px 13px;
    border-radius: 12px;
  }

  .map-banner[data-tone="warn"] { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, var(--border)); }
  .map-banner[hidden] { display: none; }

  /* ---------------- control bar ---------------- */
  .control-bar {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 18px 20px;
    position: relative;
  }

  .control-spacer { width: 78px; flex: none; }

  .end-link {
    position: absolute;
    left: 18px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 6px;
    cursor: pointer;
  }
  .end-link[hidden] { display: none; }

  .go-btn {
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: none;
    background: var(--amber);
    color: var(--amber-ink);
    font-family: "Baloo 2", ui-rounded, sans-serif;
    font-weight: 800;
    font-size: 19px;
    letter-spacing: 0.02em;
    cursor: pointer;
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--amber) 16%, transparent), 0 10px 28px var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.12s ease, background 0.15s ease;
  }

  .go-btn:active { transform: scale(0.94); }

  .go-btn[data-active="true"] {
    background: var(--surface-2);
    color: var(--text);
    border: 3px solid var(--danger);
  }

  .go-btn[data-active="true"]::after {
    content: "";
    width: 22px;
    height: 22px;
    background:
      linear-gradient(90deg, var(--danger) 30%, transparent 30%, transparent 40%, var(--danger) 40%, var(--danger) 60%, transparent 60%, transparent 70%, var(--danger) 70%);
  }

  .go-btn[data-active="true"] #go-btn-label { display: none; }

  /* ---------------- toast ---------------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 118px;
    transform: translateX(-50%) translateY(10px);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 900;
  }

  .toast[data-show="true"] { opacity: 1; transform: translateX(-50%) translateY(0); }

  .foot {
    text-align: center;
    font-size: 10px;
    color: var(--text-faint);
    padding: 0 18px 10px;
    flex: none;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.001ms !important; }
  }
</style>

<div id="app">
  <header class="stat-strip">
    <div class="stat">
      <span class="stat-value" id="stat-km">0.00</span>
      <span class="stat-label">KM</span>
    </div>
    <div class="stat stat-primary">
      <span class="stat-value" id="stat-time">00:00</span>
      <span class="stat-label">Time</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-baxs">0.000</span>
      <span class="stat-label">$bAXS</span>
    </div>
  </header>

  <div class="mode-row">
    <div class="mode-toggle" role="group" aria-label="Activity mode">
      <button class="mode-btn" data-mode="walk" data-selected="true">Walk</button>
      <button class="mode-btn" data-mode="run">Run</button>
    </div>
    <div class="gps-tag" id="gps-tag" data-state="idle">
      <span class="dot"></span><span id="gps-tag-text">GPS ready</span>
    </div>
  </div>

  <div class="trail-wrap" id="trail-wrap">
    <canvas id="trail-canvas"></canvas>
    <div class="trail-tag">Live trail</div>
    <div class="map-banner" id="map-banner" hidden></div>
  </div>

  <div class="foot">This preview draws your path on a plain grid, not real map imagery — a live basemap can't load inside this page. The downloadable version has the real map.</div>

  <footer class="control-bar">
    <button class="end-link" id="end-link" hidden>End &amp; save</button>
    <button class="go-btn" id="go-btn" data-active="false" aria-label="Start walk">
      <span id="go-btn-label">GO</span>
    </button>
    <div class="control-spacer" aria-hidden="true"></div>
  </footer>
</div>

<div class="toast" id="toast"></div>

   directly (not embedded) and you grant location — this draws your actual
   path as a line on a plain grid instead of over map imagery. The
   downloadable project (ask for it again anytime) has the real map.

const STRIDE_M = 0.78;
const BAXS_PER_STEP = 0.1 / 1000;
const MIN_ACCURACY_M = 35;
const MAX_PLAUSIBLE_SPEED_MPS = 8;
const SIM_SPEED_MPS = { walk: 1.35, run: 2.7 };
const SIM_LOOP_RADIUS_M = 22;

let state = { totalKm: 0, totalBaxs: 0, totalSteps: 0 };
let persistMode = 'memory';
let dbDoc = null;
let saveTimer = null;

function clone(o) { return JSON.parse(JSON.stringify(o)); }

function scheduleSave() {
  if (saveTimer) return;
  saveTimer = setTimeout(async () => {
    saveTimer = null;
    if (persistMode === 'db' && dbDoc) {
      try { await dbDoc.set(clone(state)); } catch (e) { /* best-effort */ }
    } else if (persistMode === 'local') {
      try { localStorage.setItem('petal-trail-gps-v1', JSON.stringify(state)); } catch (e) { /* ignore */ }
    }
  }, 250);
}

async function initPersistence() {
  try {
    const db = await window.claude?.use?.('db');
    if (db) {
      dbDoc = db.doc('game/gps-state');
      const snap = await dbDoc.get();
      if (snap.exists && snap.data()) state = { ...state, ...snap.data() };
      persistMode = 'db';
      render();
      return;
    }
  } catch (e) { /* fall through */ }
  try {
    const raw = localStorage.getItem('petal-trail-gps-v1');
    if (raw) state = { ...state, ...JSON.parse(raw) };
    persistMode = 'local';
  } catch (e) {
    persistMode = 'memory';
  }
  render();
}

const el = {
  km: document.getElementById('stat-km'),
  time: document.getElementById('stat-time'),

};
const ctx = el.canvas.getContext('2d');

const portraitImg = new Image();
portraitImg.src = `data:image/png;base64,${PORTRAIT_B64}`;

function fmtTime(sec) {
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function render() {
  el.km.textContent = (state.totalKm + sessionKm).toFixed(2);
  el.time.textContent = fmtTime(elapsedSec);
  el.baxs.textContent = (state.totalBaxs + sessionBaxs).toFixed(3);
}

function showToast(msg) {
  el.toast.textContent = msg;
  el.toast.dataset.show = 'true';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.toast.dataset.show = 'false'; }, 1800);
}

function setGpsState(kind, text) {
  el.gpsTag.dataset.state = kind;
  el.gpsTagText.textContent = text;
}

function showBanner(text, tone) {
  el.mapBanner.textContent = text;
  el.mapBanner.dataset.tone = tone || '';
  el.mapBanner.hidden = false;
}
function hideBanner() { el.mapBanner.hidden = true; }

/* ---------------------------------------------------------------------
   Local-plane trail (lat/lng -> meters around the session's first fix)
   --------------------------------------------------------------------- */
let originLat = null, originLng = null;
let pathXY = []; // [{x, y}] meters, y positive = north

function toLocalXY(lat, lng) {
  if (originLat == null) { originLat = lat; originLng = lng; }
  const x = (lng - originLng) * 111320 * Math.cos(originLat * Math.PI / 180);
  const y = (lat - originLat) * 110540;
  return { x, y };
}

function haversineMeters(a, b) {
  const R = 6371000;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180;
  const la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function resizeCanvas() {
  const rect = el.wrap.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  el.canvas.width = rect.width * dpr;
  el.canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawTrail();
}
new ResizeObserver(resizeCanvas).observe(el.wrap);

function drawTrail() {
  const rect = el.wrap.getBoundingClientRect();
  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--surface') || '#131316';
  ctx.fillRect(0, 0, w, h);

  if (pathXY.length === 0) {
    drawGrid(w, h, 1, w / 2, h / 2);
    return;
  }

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of pathXY) {
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const spanX = Math.max(maxX - minX, 8);
  const spanY = Math.max(maxY - minY, 8);
  const pad = 0.22;
  const scale = Math.min(
    (w * (1 - pad)) / spanX,
    (h * (1 - pad)) / spanY,
    45
  );
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;

  function project(p) {
    return { sx: w / 2 + (p.x - cx) * scale, sy: h / 2 - (p.y - cy) * scale };
  }

  drawGrid(w, h, scale, w / 2 - cx * scale, h / 2 + cy * scale);

  ctx.beginPath();
  pathXY.forEach((p, i) => {
    const { sx, sy } = project(p);
    if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
  });
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#ff9d2e';
  ctx.shadowColor = 'rgba(255,157,46,0.55)';
  ctx.shadowBlur = 10;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // start flag
  const start = project(pathXY[0]);
  ctx.beginPath();
  ctx.arc(start.sx, start.sy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#6be3a6';
  ctx.fill();

  // current position portrait marker
  const cur = project(pathXY[pathXY.length - 1]);
  const r = 23;
  ctx.save();
  ctx.beginPath();
  ctx.arc(cur.sx, cur.sy, r, 0, Math.PI * 2);
  ctx.closePath();
  ctx.fillStyle = '#1c1c20';
  ctx.shadowColor = 'rgba(255,157,46,0.35)';
  ctx.shadowBlur = 14;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.clip();
  if (portraitImg.complete && portraitImg.naturalWidth) {
    ctx.drawImage(portraitImg, cur.sx - r, cur.sy - r * 0.94, r * 2, r * 2 * 1.05);
  }
  ctx.restore();
  ctx.beginPath();
  ctx.arc(cur.sx, cur.sy, r, 0, Math.PI * 2);
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#ff9d2e';
  ctx.stroke();
}

function drawGrid(w, h, scale, originScreenX, originScreenY) {
  const stepM = scale < 8 ? 50 : scale < 20 ? 20 : 10;
  const stepPx = stepM * scale;
  if (stepPx < 4) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = originScreenX % stepPx; x < w; x += stepPx) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = originScreenY % stepPx; y < h; y += stepPx) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}

/* ---------------------------------------------------------------------
   Session state
   --------------------------------------------------------------------- */
let mode = 'walk';
let active = false;
let watchId = null;
let simTimer = null;
let simAngle = 0;
let lastFix = null;
let sessionKm = 0, sessionSteps = 0, sessionBaxs = 0, elapsedSec = 0;
let tickTimer = null;

function addDistanceMeters(m) {
  if (m <= 0) return;
  sessionKm += m / 1000;
  sessionSteps += m / STRIDE_M;
  sessionBaxs = sessionSteps * BAXS_PER_STEP;
  render();
}

function applyFix(lat, lng, accuracy, tsMs) {
  const local = toLocalXY(lat, lng);
  pathXY.push(local);
  drawTrail();

  if (lastFix) {
    const dtSec = Math.max(0.001, (tsMs - lastFix.t) / 1000);
    const distM = haversineMeters(lastFix, { lat, lng });
    const speed = distM / dtSec;
    const goodAccuracy = accuracy == null || accuracy <= MIN_ACCURACY_M;
    const plausible = speed <= MAX_PLAUSIBLE_SPEED_MPS;
    if (goodAccuracy && plausible) addDistanceMeters(distM);
  }
  lastFix = { lat, lng, t: tsMs };
}

function startSimulated() {
  setGpsState('simulated', 'Simulated route');
  showBanner('Location unavailable here — showing a simulated demo path.', 'warn');
  const baseLat = 13.05, baseLng = 80.2824;
  lastFix = { lat: baseLat, lng: baseLng, t: Date.now() };
  let last = Date.now();
  simTimer = setInterval(() => {
    const now = Date.now();
    const dt = (now - last) / 1000;
    last = now;
    const speed = SIM_SPEED_MPS[mode];
    simAngle += (speed * dt) / SIM_LOOP_RADIUS_M;
    const dx = Math.cos(simAngle) * SIM_LOOP_RADIUS_M;
    const dy = Math.sin(simAngle) * SIM_LOOP_RADIUS_M;
    const lat = baseLat + dy / 110540;
    const lng = baseLng + dx / (111320 * Math.cos(baseLat * Math.PI / 180));
    applyFix(lat, lng, 5, now);
  }, 1000);
}
function stopSimulated() { if (simTimer) { clearInterval(simTimer); simTimer = null; } }

function startLiveTracking() {
  if (!('geolocation' in navigator)) { startSimulated(); return; }
  navigator.geolocation.getCurrentPosition(
    () => {
      setGpsState('live', 'GPS live');
      hideBanner();
      let lastGoodFixAt = Date.now();
      let lostSignalNotified = false;
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          lastGoodFixAt = Date.now();
          lostSignalNotified = false;
          applyFix(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, pos.timestamp);
        },
        (err) => {
          console.warn('geolocation watch error', err);
          if (!lostSignalNotified && Date.now() - lastGoodFixAt > 8000) {
            lostSignalNotified = true;
            showToast('Lost GPS signal');
          }
        },
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    },
    (err) => { console.warn('geolocation denied/unavailable', err); startSimulated(); },
    { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
  );
}
function stopTracking() {
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  stopSimulated();
}

/* ---------------------------------------------------------------------
   Controls
   --------------------------------------------------------------------- */
document.querySelectorAll('.mode-btn').forEach((btn) => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach((b) => b.dataset.selected = String(b === btn));
  });
});

function startSession() {
  active = true;
  el.goBtn.dataset.active = 'true';
  el.endLink.hidden = false;
  setGpsState('idle', 'Locating…');
  startLiveTracking();
  tickTimer = setInterval(() => { elapsedSec += 1; render(); }, 1000);
}
function pauseSession() {
  active = false;
  el.goBtn.dataset.active = 'false';
  clearInterval(tickTimer);
  stopTracking();
  lastFix = null;
  setGpsState('idle', 'Paused');
  hideBanner();
}
el.goBtn.addEventListener('click', () => { if (active) pauseSession(); else startSession(); });

el.endLink.addEventListener('click', () => {
  if (active) pauseSession();
  state.totalKm += sessionKm;
  state.totalBaxs += sessionBaxs;
  state.totalSteps += sessionSteps;
  scheduleSave();
  showToast(`Saved +${sessionBaxs.toFixed(3)} $bAXS`);
  sessionKm = 0; sessionSteps = 0; sessionBaxs = 0; elapsedSec = 0;
  pathXY = []; originLat = null; originLng = null;
  el.endLink.hidden = true;
  drawTrail();
  render();
});

(async function boot() {
  await initPersistence();
